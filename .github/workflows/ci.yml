name: CI
on: [push, pull_request]

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Architecture rules run FIRST — if they fail there is no point compiling,
      # because code that runs is still code with the wrong architecture.
      # Kịch bản luật là bash — bỏ qua trên Windows, ubuntu và macOS đã chạy nó.
      - name: Architecture rules (18 rules)
        if: runner.os != 'Windows'
        run: tools/kiem-luat-phu-thuoc.sh

      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      # Số phép thử và số vector ghi trong tài liệu phải khớp số THẬT. Cần bản
      # dựng nên không nằm trong `kiem-luat-phu-thuoc.sh` (chạy trước biên dịch).
      - name: Documented counts are real
        if: runner.os == 'Linux'
        run: tools/kiem-so-lieu.sh

      # Adapter trợ năng NỐI VÀO HỆ ĐIỀU HÀNH — một adapter khác nhau cho mỗi
      # nền, sau cờ `accesskit-platform`. `--workspace` trơn không chạm tới nó.
      #
      # Ba nền, ba bước ở ba chỗ khác nhau trong tệp này (macOS ở đây, Linux ở
      # `linux-render`, Windows ở `windows-render`) — vì hai nền kia cần gói hệ
      # thống mà công việc này không cài. Mỗi bước có ĐỦ CẢ `check` LẪN `test`:
      # luật 21, và ở đây nó không phải hình thức — phép thử canh việc gốc cây
      # được bọc thành `Role::Window` cho AT-SPI là thứ duy nhất kiểm được mà
      # không cần một trình đọc màn hình thật.
      #
      # ⚠️ Không có bước nào ở đây chứng minh NVDA/Narrator/Orca đọc được. CI
      # không có trình đọc màn hình nào; nó chỉ chứng minh mã dựng được và phần
      # logic thuần là đúng. Xem chú thích đầu
      # `crates/tcc-render-raster/src/accesskit_bridge/platform.rs`.
      - name: AccessKit platform adapter (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo check -p tcc-render-raster --features accesskit-platform --all-targets
          cargo clippy -p tcc-render-raster --features accesskit-platform --all-targets -- -D warnings
          cargo test -p tcc-render-raster --features accesskit-platform

      # Đường nhập ví cũ nằm sau cờ, nên `--workspace` trơn KHÔNG biên dịch nó.
      # Mã không được biên dịch trong CI là mã hỏng lúc nào không ai biết.
      # Cầu nối trợ năng (4.4) nằm sau cờ, nên `--workspace` trơn không biên
      # dịch nó. Mã không được biên dịch trong CI là mã hỏng lúc nào không ai biết.
      - name: AccessKit bridge
        run: |
          cargo clippy -p tcc-render-raster --features accesskit --all-targets -- -D warnings
          cargo test -p tcc-render-raster --features accesskit

      - name: Web-wallet import path
        run: |
          cargo clippy -p tcc-chain --features import-web-wallet --all-targets -- -D warnings
          cargo test -p tcc-chain --features import-web-wallet
          cargo clippy -p tcc-shell --features import-web-wallet --all-targets -- -D warnings
          cargo test -p tcc-shell --features import-web-wallet

      # Kho khoá THẬT chỉ dựng được trên macOS. Không chạy `unlock` ở đây: nó
      # hỏi Touch ID, mà runner thì không có ai chạm vào — cùng lý do cổng gõ
      # tiếng Việt cần một con người.
      - name: Real keystore builds and its non-prompting paths pass
        if: runner.os == 'macOS'
        run: |
          cargo test -p tcc-keystore --features os-keystore
          cargo clippy -p tcc-shell --features os-keystore --all-targets -- -D warnings
          cargo test -p tcc-shell --features os-keystore
          # Đường gửi giao dịch chỉ dựng được khi có CẢ HAI cờ. Chỉ biên dịch,
          # không chạy: nó cần mạng, cần Touch ID, và cần một con người bấm.
          cargo clippy -p tcc-shell --features "network,os-keystore" --all-targets -- -D warnings
          cargo clippy -p tcc-shell --features wallet --all-targets -- -D warnings
          cargo test -p tcc-shell --features wallet

      # This is what turns the specification into a STANDARD. Leave it out of CI
      # and the standard drifts away from the implementation with nobody noticing.
      - name: Conformance suite
        run: cargo run -p tcc-conformance

      # Re-signing the committed example must change NOTHING.
      #
      # Two claims in one check. Signing is deterministic, so the same package
      # and key produce the same bytes — that is stated in 03-signature.md and
      # nothing outside the vectors tested it end to end. And the example in
      # the repository is exactly what today's code produces, so it cannot
      # quietly become a fossil signed by an older format while still
      # verifying.
      - name: Re-signing the example changes nothing
        if: runner.os != 'Windows'
        run: |
          examples/ky-lai.sh
          git diff --exit-code examples/

      # The committed example must ALWAYS verify. Editing `content/` and
      # forgetting to re-sign is the easiest mistake to make here, and it makes
      # everyone downstream copy a broken package.
      - name: Example hello-tcc still verifies
        run: cargo run -p tcc-cli -- verify examples/hello-tcc

      # Parsers see UNAUTHENTICATED input: verify_package must decode the
      # manifest before it can verify the signature, because the public key is
      # inside the manifest. The seed is derived from the commit SHA so every
      # push explores new inputs — and a failure is still reproducible, because
      # the seed is printed in the log.
      - name: Fuzz the parsers
        # `shell: bash` chứ không bỏ qua Windows: số học `$((16#...))` là cú
        # pháp bash, mà runner Windows mặc định dùng PowerShell. Git Bash có
        # sẵn ở đó, nên bộ phân tích vẫn được fuzz trên cả ba hệ.
        shell: bash
        run: |
          SEED=$((16#$(git rev-parse HEAD | cut -c1-8)))
          echo "seed $SEED (from commit $(git rev-parse --short HEAD))"
          cargo run -p tcc-fuzz --release -- 200000 "$SEED"

      # An independent implementation re-checks the ML-DSA half. It agrees only
      # on that half's arithmetic — but that half is the one nobody should be
      # trusted to implement alone.
      # A virtualenv, not a bare `pip install`: both runners ship an
      # externally-managed Python (PEP 668) that refuses system-wide installs.
      - name: Independent cross-check (dilithium-py)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv /tmp/venv-doi-chieu
          /tmp/venv-doi-chieu/bin/pip install --quiet dilithium-py
          /tmp/venv-doi-chieu/bin/python conformance/doi-chieu-doc-lap.py

      # The other direction: a package BUILT in Python, verified by the Rust.
      # Vectors check that the parser rejects the right things; they cannot
      # check that a different implementation can CONSTRUCT something this one
      # accepts, and an implementation that rejects everything wrong while
      # producing nothing right still cannot exchange packages with anyone.
      - name: Package built in Python, verified by Rust
        if: runner.os != 'Windows'
        run: |
          /tmp/venv-doi-chieu/bin/pip install --quiet blake3
          /tmp/venv-doi-chieu/bin/python conformance/dung-goi-doc-lap.py

  # The parts that need a SCREEN, kept separate. Not merged into the job above
  # because a failure here is a different kind of news than a failure in the
  # logic.
  #
  # ⚠️ This job lost most of its steps on 2026-08-23. They drove a real WebKit
  # view and asked it what it saw — the one place that could prove app-supplied
  # text never became markup. There is no markup any more, so there is nothing
  # left for that question to be about. What replaced it is weaker in one way
  # and stronger in another: no third party confirms the drawing, but the
  # drawing has no parser to be confused.
  adversarial:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # ⚠️ Chạy CHÍNH cái nhị phân sản phẩm, đi hết đường. Ngày 24/08/2026 nó
      # abort đúng lúc chuyển màn trong khi mọi phép thử đều xanh — không phép
      # thử nào chạy nó qua hai màn hình.
      - name: The product binary, all the way through
        run: tools/kiem-khoi-ung-dung.sh

      - name: Three-way capability gate
        run: cargo run -p tcc-shell --example kiem-hanh-vi examples/hello-tcc
      - name: Permission store on disk
        run: cargo run -p tcc-shell --example kiem-ghi-nho examples/hello-tcc

  # Dependencies against the RustSec advisory database.
  #
  # Its own job, and cached. Putting `cargo install cargo-audit` inside the
  # main job tripled every push from 1m20 to 4m30 — a check that only depends
  # on Cargo.lock should not sit on the critical path of every other check.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - name: Install cargo-audit if not cached
        run: which cargo-audit || cargo install cargo-audit --locked

      # Fails on a vulnerability. Maintenance warnings are reported without
      # failing: none of them reach tcc-crypto, and none can be fixed from here.
      # SECURITY.md §3.5b says which and why — that list shrank on 2026-08-23
      # when the web engine went, and it needs re-reading rather than trusting.
      - name: Vulnerabilities
        run: cargo audit
      - name: Maintenance warnings, reported not enforced
        run: cargo audit --deny warnings || true

  # The declared minimum supported Rust version, actually tried.
  #
  # Cargo.toml says rust-version = "1.90". Nothing checked it, so it was a
  # claim rather than a fact — and a dependency bumping its own MSRV would
  # have broken it silently for anyone not on the newest toolchain. Same
  # class as every other unwatched claim in this repository.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from Cargo.toml, do not hardcode it here
        id: msrv
        run: |
          V=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "MSRV declared as $V"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-targets
      - run: cargo check --workspace --all-targets --features tcc-shell/network

  # Does the renderer even BUILD on Linux?
  #
  # The `tcc-ui` / `tcc-render-*` seam exists so the renderer can be replaced.
  # It was replaced on 2026-08-23, and the replacement has only ever run on
  # macOS — so the portability claim is untested again, and an auditor on Linux
  # would be the one to find out. That is what this job is for.
  linux-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `tao` vẫn cần GTK để mở cửa sổ trên Linux. WebKitGTK thì không còn ai
      # cần — máy dựng web đã bỏ.
      - name: GTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - run: cargo check -p tcc-shell --features window --all-targets
      # ⚠️ `check` KHÔNG chạy phép thử nào. Mã sau một cờ mà CI chỉ `check` thì
      # biên dịch được mà chưa lần nào thực thi, và một phép thử chưa từng chạy
      # không phải một chắn. Luật 21 canh việc mỗi cờ được `check` thì cũng
      # phải được `test`.
      - run: cargo test -p tcc-shell --features window
      # Bộ dựng ra pixel: cửa sổ riêng, trợ năng riêng. Luật 21 đòi cờ nào được
      # `check` thì cũng phải được `test`.
      - run: cargo check -p tcc-render-raster --features window --all-targets
      - run: cargo test -p tcc-render-raster --features window
      # Trợ năng trên nền AT-SPI (`accesskit_unix`). Suốt giai đoạn 4 chỗ này
      # KHÔNG có gì cả — adapter chỉ nối trên macOS — nên một người dùng Orca
      # mở trình duyệt này ra thì không nghe được gì, và không có bước CI nào
      # nói ra điều đó.
      #
      # ⚠️ Bước này chứng minh mã DỰNG ĐƯỢC trên Linux, không chứng minh Orca
      # đọc được. Runner không có D-Bus phiên lẫn trình đọc màn hình nào; phép
      # thử chạy ở đây là phần logic thuần (bọc gốc cây thành `Role::Window`,
      # mã nút giả không va mã thật). Đường chạy thật vẫn chưa ai nghe thử.
      - run: cargo check -p tcc-render-raster --features accesskit-platform --all-targets
      - run: cargo clippy -p tcc-render-raster --features accesskit-platform --all-targets -- -D warnings
      - run: cargo test -p tcc-render-raster --features accesskit-platform


      # ⚠️ Cả khối ví dụ đối kháng chạy dưới `xvfb` đã bỏ ngày 23/08/2026, cùng
      # bộ dựng web mà chúng lái. Chúng là những phép kiểm hỏi MỘT BÊN THỨ BA
      # ("engine, anh thấy gì?"), và mất chúng là mất bên thứ ba — xem
      # SECURITY.md §3.7. Không có gì thay thế ở đây; chỗ trống này là thật.

  # Does the renderer build on Windows? It has never been compiled there.
  #
  # Same question as linux-render, and that one found nothing while adding
  # Windows to the main matrix found a broken checkout. A build check is
  # deterministic, so this one is enforced after a single passing run.
  windows-render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p tcc-shell --features window --all-targets
      # ⚠️ `check` KHÔNG chạy phép thử nào. Mã sau một cờ mà CI chỉ `check` thì
      # biên dịch được mà chưa lần nào thực thi, và một phép thử chưa từng chạy
      # không phải một chắn. Luật 21 canh việc mỗi cờ được `check` thì cũng
      # phải được `test`.
      - run: cargo test -p tcc-shell --features window
      # Bộ dựng ra pixel: cửa sổ riêng, trợ năng riêng. Luật 21 đòi cờ nào được
      # `check` thì cũng phải được `test`.
      - run: cargo check -p tcc-render-raster --features window --all-targets
      - run: cargo test -p tcc-render-raster --features window
      # Trợ năng trên UI Automation (`accesskit_windows`). Cùng lý do, cùng giới
      # hạn như bước AT-SPI ở `linux-render`: dựng được ≠ NVDA đọc được, và
      # runner không có NVDA lẫn Narrator.
      - run: cargo check -p tcc-render-raster --features accesskit-platform --all-targets
      - run: cargo clippy -p tcc-render-raster --features accesskit-platform --all-targets -- -D warnings
      - run: cargo test -p tcc-render-raster --features accesskit-platform
