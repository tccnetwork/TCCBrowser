name: CI
on: [push, pull_request]

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Architecture rules run FIRST — if they fail there is no point compiling,
      # because code that runs is still code with the wrong architecture.
      # Kịch bản luật là bash — bỏ qua trên Windows, ubuntu và macOS đã chạy nó.
      - name: Architecture rules (18 rules)
        if: runner.os != 'Windows'
        run: tools/kiem-luat-phu-thuoc.sh

      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      # Số phép thử và số vector ghi trong tài liệu phải khớp số THẬT. Cần bản
      # dựng nên không nằm trong `kiem-luat-phu-thuoc.sh` (chạy trước biên dịch).
      - name: Documented counts are real
        if: runner.os == 'Linux'
        run: tools/kiem-so-lieu.sh

      # Đường nhập ví cũ nằm sau cờ, nên `--workspace` trơn KHÔNG biên dịch nó.
      # Mã không được biên dịch trong CI là mã hỏng lúc nào không ai biết.
      # Cầu nối trợ năng (4.4) nằm sau cờ, nên `--workspace` trơn không biên
      # dịch nó. Mã không được biên dịch trong CI là mã hỏng lúc nào không ai biết.
      - name: AccessKit bridge
        run: |
          cargo clippy -p tcc-render-raster --features accesskit --all-targets -- -D warnings
          cargo test -p tcc-render-raster --features accesskit
          cargo test -p tcc-shell --features accesskit --test hai-bo-dung

      - name: Web-wallet import path
        run: |
          cargo clippy -p tcc-chain --features import-web-wallet --all-targets -- -D warnings
          cargo test -p tcc-chain --features import-web-wallet
          cargo clippy -p tcc-shell --features import-web-wallet --all-targets -- -D warnings
          cargo test -p tcc-shell --features import-web-wallet

      # Kho khoá THẬT chỉ dựng được trên macOS. Không chạy `unlock` ở đây: nó
      # hỏi Touch ID, mà runner thì không có ai chạm vào — cùng lý do cổng gõ
      # tiếng Việt cần một con người.
      - name: Real keystore builds and its non-prompting paths pass
        if: runner.os == 'macOS'
        run: |
          cargo test -p tcc-keystore --features os-keystore
          cargo clippy -p tcc-shell --features os-keystore --all-targets -- -D warnings
          cargo test -p tcc-shell --features os-keystore
          # Đường gửi giao dịch chỉ dựng được khi có CẢ HAI cờ. Chỉ biên dịch,
          # không chạy: nó cần mạng, cần Touch ID, và cần một con người bấm.
          cargo clippy -p tcc-shell --features "network,os-keystore" --all-targets -- -D warnings
          cargo clippy -p tcc-shell --features wallet --all-targets -- -D warnings
          cargo test -p tcc-shell --features wallet

      # This is what turns the specification into a STANDARD. Leave it out of CI
      # and the standard drifts away from the implementation with nobody noticing.
      - name: Conformance suite
        run: cargo run -p tcc-conformance

      # Re-signing the committed example must change NOTHING.
      #
      # Two claims in one check. Signing is deterministic, so the same package
      # and key produce the same bytes — that is stated in 03-signature.md and
      # nothing outside the vectors tested it end to end. And the example in
      # the repository is exactly what today's code produces, so it cannot
      # quietly become a fossil signed by an older format while still
      # verifying.
      - name: Re-signing the example changes nothing
        if: runner.os != 'Windows'
        run: |
          examples/ky-lai.sh
          git diff --exit-code examples/

      # The committed example must ALWAYS verify. Editing `content/` and
      # forgetting to re-sign is the easiest mistake to make here, and it makes
      # everyone downstream copy a broken package.
      - name: Example hello-tcc still verifies
        run: cargo run -p tcc-cli -- verify examples/hello-tcc

      # Parsers see UNAUTHENTICATED input: verify_package must decode the
      # manifest before it can verify the signature, because the public key is
      # inside the manifest. The seed is derived from the commit SHA so every
      # push explores new inputs — and a failure is still reproducible, because
      # the seed is printed in the log.
      - name: Fuzz the parsers
        # `shell: bash` chứ không bỏ qua Windows: số học `$((16#...))` là cú
        # pháp bash, mà runner Windows mặc định dùng PowerShell. Git Bash có
        # sẵn ở đó, nên bộ phân tích vẫn được fuzz trên cả ba hệ.
        shell: bash
        run: |
          SEED=$((16#$(git rev-parse HEAD | cut -c1-8)))
          echo "seed $SEED (from commit $(git rev-parse --short HEAD))"
          cargo run -p tcc-fuzz --release -- 200000 "$SEED"

      # An independent implementation re-checks the ML-DSA half. It agrees only
      # on that half's arithmetic — but that half is the one nobody should be
      # trusted to implement alone.
      # A virtualenv, not a bare `pip install`: both runners ship an
      # externally-managed Python (PEP 668) that refuses system-wide installs.
      - name: Independent cross-check (dilithium-py)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv /tmp/venv-doi-chieu
          /tmp/venv-doi-chieu/bin/pip install --quiet dilithium-py
          /tmp/venv-doi-chieu/bin/python conformance/doi-chieu-doc-lap.py

      # The other direction: a package BUILT in Python, verified by the Rust.
      # Vectors check that the parser rejects the right things; they cannot
      # check that a different implementation can CONSTRUCT something this one
      # accepts, and an implementation that rejects everything wrong while
      # producing nothing right still cannot exchange packages with anyone.
      - name: Package built in Python, verified by Rust
        if: runner.os != 'Windows'
        run: |
          /tmp/venv-doi-chieu/bin/pip install --quiet blake3
          /tmp/venv-doi-chieu/bin/python conformance/dung-goi-doc-lap.py

  # The parts that need a SCREEN, kept separate: adversarial examples driven
  # through a real WebKit view. Not merged into the job above because Ubuntu has
  # no macOS WebKit, and because a failure here is a different kind of news than
  # a failure in the logic.
  adversarial:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: App-supplied text cannot escape into the document
        run: cargo run -p tcc-shell --features window --example kiem-khoi-tan-cong
      - name: Content policy blocks script (layer 3 tested ALONE)
        run: cargo run -p tcc-shell --features window --example kiem-khoi-tan-cong chi-csp
      - name: Click through to decision
        run: |
          cargo run -p tcc-shell --features window --example kiem-bam-nut cho-phep
          cargo run -p tcc-shell --features window --example kiem-bam-nut tu-choi
          cargo run -p tcc-shell --features window --example kiem-bam-nut bat
          cargo run -p tcc-shell --features window --example kiem-bam-nut ma
          cargo run -p tcc-shell --features window --example kiem-bam-nut ct-ma
          cargo run -p tcc-shell --features window --example kiem-bam-nut o-nhap
          cargo run -p tcc-shell --features wallet --example kiem-cum-tu-sai
      - name: App screen through real WebKit
        run: cargo run -p tcc-shell --features window --example kiem-man-hinh-ung-dung examples/hello-tcc
      - name: Three-way capability gate
        run: cargo run -p tcc-shell --example kiem-hanh-vi examples/hello-tcc
      - name: Permission store on disk
        run: cargo run -p tcc-shell --example kiem-ghi-nho examples/hello-tcc

  # Dependencies against the RustSec advisory database.
  #
  # Its own job, and cached. Putting `cargo install cargo-audit` inside the
  # main job tripled every push from 1m20 to 4m30 — a check that only depends
  # on Cargo.lock should not sit on the critical path of every other check.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - name: Install cargo-audit if not cached
        run: which cargo-audit || cargo install cargo-audit --locked

      # Fails on a vulnerability. Maintenance warnings are reported without
      # failing: they are wry's GTK backend and build-time codegen, none of
      # them reach tcc-crypto, and none can be fixed from here. SECURITY.md
      # §3.5b says which and why.
      - name: Vulnerabilities
        run: cargo audit
      - name: Maintenance warnings, reported not enforced
        run: cargo audit --deny warnings || true

  # The declared minimum supported Rust version, actually tried.
  #
  # Cargo.toml says rust-version = "1.90". Nothing checked it, so it was a
  # claim rather than a fact — and a dependency bumping its own MSRV would
  # have broken it silently for anyone not on the newest toolchain. Same
  # class as every other unwatched claim in this repository.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from Cargo.toml, do not hardcode it here
        id: msrv
        run: |
          V=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "MSRV declared as $V"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-targets
      - run: cargo check --workspace --all-targets --features tcc-shell/network

  # Does the renderer even BUILD on Linux?
  #
  # `wry` is meant to be portable — WKWebView on macOS, WebKitGTK on Linux,
  # WebView2 on Windows — and that portability is the whole reason for the
  # `tcc-ui` / `tcc-render-*` seam. It had never been compiled anywhere but
  # macOS, so the claim was untested, and an auditor on Linux would have been
  # the one to find out.
  #
  # It compiles, so this is a real check now, not a trial.
  linux-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: WebKitGTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo check -p tcc-render-webview --features window --all-targets
      - run: cargo check -p tcc-shell --features window --all-targets
      # ⚠️ `check` KHÔNG chạy phép thử nào. Cả nhóm chắn của tầng 2 — chặn điều
      # hướng, chặn cửa sổ mới, chặn tải tệp — nằm sau cờ `window`, và suốt thời
      # gian ở đây chỉ có `check` thì chúng biên dịch được mà chưa lần nào thực
      # thi. Một phép thử chưa từng chạy không phải một chắn. Luật 21 canh việc
      # mỗi cờ được `check` thì cũng phải được `test`.
      - run: cargo test -p tcc-render-webview --features window
      - run: cargo test -p tcc-shell --features window


      # The adversarial examples on a SECOND platform. They are the checks that
      # drive a real WebKit view and ask it what it sees, so running them on one
      # operating system only proves the defence on that one operating system.
      #
      # These were continue-on-error for months, behind a comment that said
      # WebKitGTK under xvfb does not reliably get a window handle. That comment
      # was wrong, and it is kept here in corrected form because the mistake is
      # more useful than the fix.
      #
      # The failure was "không dựng được WebView: the underlying handle is not
      # available", which mentions nothing about GTK — so it read exactly like a
      # virtual display that had not come up. It was not flaky at all: a probe
      # that ran the same binary three times in one job failed 3/3, then passed
      # 3/3 once the code built the WebView the way Linux requires. The bug was
      # ours, and the exemption is what kept anyone from finding it.
      #
      # A check exempted because "the infrastructure is unreliable" is the best
      # hiding place a real bug has. The flag is off. If Linux goes red here,
      # that is now a fact to investigate rather than a footnote.
      - name: Virtual display
        run: sudo apt-get install -y xvfb

      # Four variables, and the middle one is the one that matters on this
      # runner. WebKitGTK 2.4x renders through a DMA-BUF path that wants a real
      # GPU; under xvfb it gets none, and the failure surfaces late and
      # confusingly as "the underlying handle is not available" rather than as
      # anything mentioning graphics. Ubuntu 24.04 ships 2.44, so this is the
      # engine's default path, not an edge case.
      #
      # Set at JOB level so every xvfb step below gets them. Missing one step is
      # how a fix gets reported as flaky.
      - name: WebKitGTK under a virtual display
        run: |
          {
            echo "WEBKIT_DISABLE_DMABUF_RENDERER=1"
            echo "WEBKIT_DISABLE_COMPOSITING_MODE=1"
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "GDK_BACKEND=x11"
          } >> "$GITHUB_ENV"

      # Measure the web engine rather than describing it. The published baseline
      # is the INTERSECTION of three engines, so it must be measured on each —
      # see docs/nen-tang.md.
      #
      - name: Measure the web platform (WebKitGTK)
        run: xvfb-run -a cargo run -p tcc-shell --features window --example do-nen-tang
      - name: App text cannot escape the document (Linux)
        run: xvfb-run -a cargo run -p tcc-shell --features window --example kiem-khoi-tan-cong
      - name: Content policy blocks script, layer 3 alone (Linux)
        run: xvfb-run -a cargo run -p tcc-shell --features window --example kiem-khoi-tan-cong chi-csp
      - name: App screen through real WebKitGTK (Linux)
        run: xvfb-run -a cargo run -p tcc-shell --features window --example kiem-man-hinh-ung-dung examples/hello-tcc

  # Does the renderer build on Windows? It has never been compiled there.
  #
  # Same question as linux-render, and that one found nothing while adding
  # Windows to the main matrix found a broken checkout. wry uses WebView2 here,
  # a third engine behind the same `tcc-ui` seam — if the seam is real, this
  # compiles; if it does not, the seam is macOS plus Linux and the architecture
  # document is overstating it.
  # It compiles. A build check is deterministic, unlike the xvfb runs, so this
  # one is enforced after a single pass without the mistake made there.
  windows-render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p tcc-render-webview --features window --all-targets
      - run: cargo check -p tcc-shell --features window --all-targets
      # ⚠️ `check` KHÔNG chạy phép thử nào. Cả nhóm chắn của tầng 2 — chặn điều
      # hướng, chặn cửa sổ mới, chặn tải tệp — nằm sau cờ `window`, và suốt thời
      # gian ở đây chỉ có `check` thì chúng biên dịch được mà chưa lần nào thực
      # thi. Một phép thử chưa từng chạy không phải một chắn. Luật 21 canh việc
      # mỗi cờ được `check` thì cũng phải được `test`.
      - run: cargo test -p tcc-render-webview --features window
      - run: cargo test -p tcc-shell --features window
      # Bộ máy thứ ba: WebView2. Đo được thì nền tảng công bố mới có phần giao
      # đủ ba — xem docs/nen-tang.md.
      - name: Measure the web platform (WebView2)
        run: cargo run -p tcc-shell --features window --example do-nen-tang
