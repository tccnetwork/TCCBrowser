name: CI
on: [push, pull_request]

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Architecture rules run FIRST — if they fail there is no point compiling,
      # because code that runs is still code with the wrong architecture.
      - name: Architecture rules (17 rules)
        run: tools/kiem-luat-phu-thuoc.sh

      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      # This is what turns the specification into a STANDARD. Leave it out of CI
      # and the standard drifts away from the implementation with nobody noticing.
      - name: Conformance suite
        run: cargo run -p tcc-conformance

      # The committed example must ALWAYS verify. Editing `content/` and
      # forgetting to re-sign is the easiest mistake to make here, and it makes
      # everyone downstream copy a broken package.
      - name: Example hello-tcc still verifies
        run: cargo run -p tcc-cli -- verify examples/hello-tcc

      # Parsers see UNAUTHENTICATED input: verify_package must decode the
      # manifest before it can verify the signature, because the public key is
      # inside the manifest. The seed is derived from the commit SHA so every
      # push explores new inputs — and a failure is still reproducible, because
      # the seed is printed in the log.
      - name: Fuzz the parsers
        run: |
          SEED=$((16#$(git rev-parse HEAD | cut -c1-8)))
          echo "seed $SEED (from commit $(git rev-parse --short HEAD))"
          cargo run -p tcc-fuzz --release -- 200000 "$SEED"

      # An independent implementation re-checks the ML-DSA half. It agrees only
      # on that half's arithmetic — but that half is the one nobody should be
      # trusted to implement alone.
      # A virtualenv, not a bare `pip install`: both runners ship an
      # externally-managed Python (PEP 668) that refuses system-wide installs.
      - name: Independent cross-check (dilithium-py)
        run: |
          python3 -m venv /tmp/venv-doi-chieu
          /tmp/venv-doi-chieu/bin/pip install --quiet dilithium-py
          /tmp/venv-doi-chieu/bin/python conformance/doi-chieu-doc-lap.py

  # The parts that need a SCREEN, kept separate: adversarial examples driven
  # through a real WebKit view. Not merged into the job above because Ubuntu has
  # no macOS WebKit, and because a failure here is a different kind of news than
  # a failure in the logic.
  adversarial:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: App-supplied text cannot escape into the document
        run: cargo run -p tcc-shell --features window --example kiem-khoi-tan-cong
      - name: Content policy blocks script (layer 3 tested ALONE)
        run: cargo run -p tcc-shell --features window --example kiem-khoi-tan-cong chi-csp
      - name: Click through to decision
        run: |
          cargo run -p tcc-shell --features window --example kiem-bam-nut cho-phep
          cargo run -p tcc-shell --features window --example kiem-bam-nut tu-choi
          cargo run -p tcc-shell --features window --example kiem-bam-nut bat
          cargo run -p tcc-shell --features window --example kiem-bam-nut ma
          cargo run -p tcc-shell --features window --example kiem-bam-nut ct-ma
      - name: App screen through real WebKit
        run: cargo run -p tcc-shell --features window --example kiem-man-hinh-ung-dung examples/hello-tcc
      - name: Three-way capability gate
        run: cargo run -p tcc-shell --example kiem-hanh-vi examples/hello-tcc
      - name: Permission store on disk
        run: cargo run -p tcc-shell --example kiem-ghi-nho examples/hello-tcc

  # Dependencies against the RustSec advisory database.
  #
  # Its own job, and cached. Putting `cargo install cargo-audit` inside the
  # main job tripled every push from 1m20 to 4m30 — a check that only depends
  # on Cargo.lock should not sit on the critical path of every other check.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - name: Install cargo-audit if not cached
        run: which cargo-audit || cargo install cargo-audit --locked

      # Fails on a vulnerability. Maintenance warnings are reported without
      # failing: they are wry's GTK backend and build-time codegen, none of
      # them reach tcc-crypto, and none can be fixed from here. SECURITY.md
      # §3.5b says which and why.
      - name: Vulnerabilities
        run: cargo audit
      - name: Maintenance warnings, reported not enforced
        run: cargo audit --deny warnings || true

  # The declared minimum supported Rust version, actually tried.
  #
  # Cargo.toml says rust-version = "1.90". Nothing checked it, so it was a
  # claim rather than a fact — and a dependency bumping its own MSRV would
  # have broken it silently for anyone not on the newest toolchain. Same
  # class as every other unwatched claim in this repository.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version from Cargo.toml, do not hardcode it here
        id: msrv
        run: |
          V=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "MSRV declared as $V"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-targets
      - run: cargo check --workspace --all-targets --features tcc-shell/network

  # Does the renderer even BUILD on Linux?
  #
  # `wry` is meant to be portable — WKWebView on macOS, WebKitGTK on Linux,
  # WebView2 on Windows — and that portability is the whole reason for the
  # `tcc-ui` / `tcc-render-*` seam. It had never been compiled anywhere but
  # macOS, so the claim was untested, and an auditor on Linux would have been
  # the one to find out.
  #
  # It compiles, so this is a real check now, not a trial.
  linux-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: WebKitGTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo check -p tcc-render-webview --features window --all-targets
      - run: cargo check -p tcc-shell --features window --all-targets

      # The adversarial examples on a SECOND platform. They are the checks that
      # drive a real WebKit view and ask it what it sees, so running them on one
      # operating system only proves the defence on that one operating system.
      #
      # continue-on-error while it is being established: WebKitGTK under a
      # virtual display is a different beast from WKWebView, and a red mark here
      # should not read as "the escaping defence is broken" until this is known
      # to work at all.
      - name: Virtual display
        run: sudo apt-get install -y xvfb
      - name: App text cannot escape the document (Linux)
        continue-on-error: true
        run: xvfb-run -a cargo run -p tcc-shell --features window --example kiem-khoi-tan-cong
      - name: Content policy blocks script, layer 3 alone (Linux)
        continue-on-error: true
        run: xvfb-run -a cargo run -p tcc-shell --features window --example kiem-khoi-tan-cong chi-csp
      - name: App screen through real WebKitGTK (Linux)
        continue-on-error: true
        run: xvfb-run -a cargo run -p tcc-shell --features window --example kiem-man-hinh-ung-dung examples/hello-tcc
