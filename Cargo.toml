[workspace]
# `dam-thu/` là ĐÂM THỬ khả thi của Giai đoạn 0, không phải mã sản xuất. Để
# ngoài workspace là cố ý: `cosmic-text` kéo theo cả một cây phụ thuộc mà bản
# dựng thật không được phép mang, và `cargo test --workspace` không phải trả giá
# cho một thí nghiệm.
exclude = ["dam-thu/chu-viet"]
resolver = "3"
members = [
  # ---- Nền: không phụ thuộc gì trong workspace ----
  "crates/tcc-spec",         # kiểu dữ liệu của TIÊU CHUẨN, không logic
  "crates/tcc-crypto",       # biên giới tin cậy — ít phụ thuộc nhất, kiểm định riêng

  # ---- Tiêu chuẩn ----
  "crates/tcc-manifest",     # đọc + kiểm bản kê khai ứng dụng
  "crates/tcc-capability",   # mô hình quyền năng

  # ---- Giao diện ----
  "crates/tcc-ui",           # API component TRỪU TƯỢNG — không biết bộ dựng nào
  # Bộ dựng #2 — KHÔNG phải để đẹp hơn, mà để CHỨNG MINH luật "tcc-ui không
  # biết bộ dựng nào" là thật. Một trait chỉ có một bản cài đặt thì không ai
  # biết nó có thật sự trừu tượng hay không.
  "crates/tcc-render-raster",

  # ---- Thân ----
  "crates/tcc-runtime",      # nạp và chạy ứng dụng TCC
  "crates/tcc-chain",        # giao dịch chuỗi TCC — CHỈ tcc-shell được phụ thuộc
  "crates/tcc-keystore",     # kho khoá ví — CHỈ tcc-shell được phụ thuộc
  "crates/tcc-net",          # đường ra ngoài — CHỈ tcc-shell được phụ thuộc
  "crates/tcc-shell",        # khung trình duyệt: thẻ, thanh địa chỉ

  # ---- Công cụ ----
  "tools/tcc-cli",           # tcc new / sign / verify
  "tools/tcc-conformance",   # BỘ KIỂM ĐỊNH TUÂN THỦ — thứ biến đặc tả thành tiêu chuẩn
  "tools/tcc-fuzz",          # fuzz bộ phân tích — đầu vào CHƯA xác thực

  # ---- Sản phẩm ----
  "apps/tcc-browser",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["TCC"]

# Phiên bản dùng chung — đổi một chỗ, cả workspace theo.
[workspace.dependencies]
tcc-spec = { path = "crates/tcc-spec" }
tcc-crypto = { path = "crates/tcc-crypto" }
tcc-manifest = { path = "crates/tcc-manifest" }
tcc-capability = { path = "crates/tcc-capability" }
tcc-ui = { path = "crates/tcc-ui" }
tcc-render-raster = { path = "crates/tcc-render-raster" }
tcc-runtime = { path = "crates/tcc-runtime" }
tcc-net = { path = "crates/tcc-net" }
tcc-keystore = { path = "crates/tcc-keystore" }
tcc-chain = { path = "crates/tcc-chain" }
tcc-shell = { path = "crates/tcc-shell" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
# `deny` chứ KHÔNG phải `forbid`: forbid không gỡ được ở bất cứ đâu, mà vài crate
# (cầu trợ năng của macOS) buộc phải gọi FFI. Dùng `deny` để chỗ nào cần thì phải viết
# `#![allow(unsafe_code)]` kèm lý do — tức là cố ý và thấy được khi duyệt mã.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Chỗ nào thật sự cần thì gỡ ở crate đó kèm lý do.
unwrap_used = "warn"
expect_used = "warn"
# Tài liệu của dự án là văn xuôi TIẾNG VIỆT xen thuật ngữ tiếng Anh (AccessKit,
# ML-DSA…). `doc_markdown` đòi bọc backtick quanh từng từ như vậy,
# làm câu tiếng Việt vỡ vụn và khó đọc hơn hẳn. Ta ưu tiên chú thích dễ đọc.
doc_markdown = "allow"
