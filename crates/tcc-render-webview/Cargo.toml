[package]
name = "tcc-render-webview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Cửa sổ THẬT. Cố ý KHÔNG bật mặc định: `wry`+`tao` kéo theo 71 crate và cần một
# màn hình, mà phần có lỗi bảo mật thật (dịch đánh dấu, quét trợ năng) kiểm được
# mà không cần cả hai thứ đó.
cua-so = ["dep:wry", "dep:tao", "dep:serde_json"]

[dependencies]
tcc-ui = { workspace = true }
wry = { version = "0.52", optional = true }
tao = { version = "0.34", optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
