[package]
name = "tcc-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Cầu nối trợ năng tới hệ điều hành (mục 4.4). Chuyển tiếp xuống bộ dựng pixel.
accesskit = ["tcc-render-raster/accesskit"]
# Cửa sổ. Chuyển tiếp xuống bộ dựng — tầng trên bật cờ này, không bao giờ khai
# thẳng cờ của crate dưới.
#
# Cờ này từng tên là `cua-so-raster` và đứng cạnh một cờ `window` khác kéo theo
# `wry` cùng cả một máy dựng web. Máy dựng ấy đã bỏ, nên cái tên phân biệt hai
# đường cũng hết việc: ở đây chỉ còn MỘT cửa sổ.
window = ["tcc-render-raster/window"]
# Cửa sổ + trợ năng nối vào hệ điều hành. Tách khỏi `window` để một bản dựng có
# cửa sổ mà CHƯA có trợ năng vẫn nhìn thấy được là chưa có.
window-tro-nang = ["window", "tcc-render-raster/accesskit-platform"]
# Nhập ví cũ từ ví web. Chuyển tiếp xuống tcc-chain — tầng trên không bao giờ
# khai thẳng cờ của crate dưới.
import-web-wallet = ["tcc-chain/import-web-wallet"]
# Kho khoá THẬT của hệ điều hành. Tắt cờ này thì ví KHÔNG dùng được — cố ý,
# xem src/wallet_store.rs.
os-keystore = ["tcc-keystore/os-keystore"]
# Nhập ví trong cửa sổ: cần cả ba mảnh.
wallet = ["window", "import-web-wallet", "os-keystore"]
# Đường ra ngoài thật. Tách cờ riêng để dựng được bản KHÔNG có mạng.
network = ["dep:tcc-net"]

[dependencies]
thiserror = { workspace = true }
tcc-chain = { workspace = true }
tcc-keystore = { workspace = true }
tcc-spec = { workspace = true }
tcc-ui = { workspace = true }
tcc-runtime = { workspace = true }
tcc-capability = { workspace = true }
tcc-crypto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Đây là ĐIỂM LẮP RÁP — crate duy nhất được phép biết tới một bộ dựng cụ thể.
# Luật 2 trong tools/kiem-luat-phu-thuoc.sh chốt điều đó.
tcc-render-raster = { workspace = true }
tcc-net = { workspace = true, optional = true }

[dev-dependencies]
tcc-keystore = { workspace = true }
tcc-render-raster = { workspace = true }
tcc-chain = { workspace = true }
unicode-general-category = "1"
serde_json = { workspace = true }
tcc-spec = { workspace = true }
tcc-capability = { workspace = true }
tcc-ui = { workspace = true }
tcc-crypto = { workspace = true }
tcc-runtime = { workspace = true }

[[example]]
name = "thu-kho-khoa"
required-features = ["os-keystore"]

[[example]]
name = "man-hinh-raster"
required-features = ["window"]







[[example]]
name = "nhap-vi"
required-features = ["import-web-wallet", "os-keystore"]

[[example]]
name = "gui-giao-dich"
required-features = ["network", "os-keystore"]

[[example]]
name = "kiem-hanh-vi"

[[example]]
name = "kiem-ghi-nho"



[lints]
workspace = true
