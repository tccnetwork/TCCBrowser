[package]
name = "tcc-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Cầu nối trợ năng tới hệ điều hành (mục 4.4). Chuyển tiếp xuống bộ dựng pixel.
accesskit = ["tcc-render-raster/accesskit"]
# Chuyển tiếp xuống bộ dựng. Tầng trên bật cờ này, không bao giờ khai
# tcc-render-webview trực tiếp.
window = ["tcc-render-webview/window"]
# Cửa sổ của bộ dựng RA PIXEL. Tách khỏi `window` có chủ ý: `window` kéo theo
# `wry` và cả một máy dựng web, mà cổng ra giai đoạn 4 phải chứng minh được
# KHÔNG cần thứ đó. Bật riêng thì cây phụ thuộc tự nói ra điều ấy.
cua-so-raster = ["tcc-render-raster/window"]
# Nhập ví cũ từ ví web. Chuyển tiếp xuống tcc-chain — tầng trên không bao giờ
# khai thẳng cờ của crate dưới.
import-web-wallet = ["tcc-chain/import-web-wallet"]
# Kho khoá THẬT của hệ điều hành. Tắt cờ này thì ví KHÔNG dùng được — cố ý,
# xem src/wallet_store.rs.
os-keystore = ["tcc-keystore/os-keystore"]
# Nhập ví trong cửa sổ: cần cả ba mảnh.
wallet = ["window", "import-web-wallet", "os-keystore"]
# Đường ra ngoài thật. Tách cờ riêng để dựng được bản KHÔNG có mạng.
network = ["dep:tcc-net"]

[dependencies]
thiserror = { workspace = true }
tcc-chain = { workspace = true }
tcc-keystore = { workspace = true }
tcc-spec = { workspace = true }
tcc-ui = { workspace = true }
tcc-runtime = { workspace = true }
tcc-capability = { workspace = true }
tcc-crypto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Đây là ĐIỂM LẮP RÁP — crate duy nhất được phép biết tới một bộ dựng cụ thể.
# Luật 2 trong tools/kiem-luat-phu-thuoc.sh chốt điều đó.
tcc-render-webview = { workspace = true }
tcc-render-raster = { workspace = true }
tcc-net = { workspace = true, optional = true }

[dev-dependencies]
tcc-keystore = { workspace = true }
tcc-render-raster = { workspace = true }
tcc-chain = { workspace = true }
unicode-general-category = "1"
serde_json = { workspace = true }
tcc-spec = { workspace = true }
tcc-capability = { workspace = true }
tcc-render-webview = { workspace = true }
tcc-ui = { workspace = true }
tcc-crypto = { workspace = true }
tcc-runtime = { workspace = true }

[[example]]
name = "man-hinh-raster"
required-features = ["cua-so-raster"]

[[example]]
name = "kiem-khoi-tan-cong"
required-features = ["window"]

[[example]]
name = "kiem-bam-nut"
required-features = ["window"]

[[example]]
name = "kiem-man-hinh-ung-dung"
required-features = ["window"]

[[example]]
name = "do-nen-tang"
required-features = ["window"]

[[example]]
name = "thu-vi-mot-phien"
required-features = ["wallet", "network"]

[[example]]
name = "kiem-cum-tu-sai"
required-features = ["wallet"]

[[example]]
name = "nhap-vi"
required-features = ["import-web-wallet", "os-keystore"]

[[example]]
name = "gui-giao-dich"
required-features = ["network", "os-keystore"]

[[example]]
name = "kiem-hanh-vi"

[[example]]
name = "kiem-ghi-nho"

[[example]]
name = "xem-man-hinh"
required-features = ["window"]

[[example]]
name = "kiem-go-tieng-viet"
required-features = ["window"]

[lints]
workspace = true
